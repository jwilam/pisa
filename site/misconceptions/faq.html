  let L = T[lang], ITEMS = [], BY = {}, cat = '', query = '', mode = 'read', busy = false;
  const CACHE = {};

  /* ---------- 文字工具 ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^\s*(javascript|data|vbscript):/i.test(u) ? '#' : u;
  const ext = u => /^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : '';
  const shortUrl = u => { try { const x = new URL(u.replace(/&amp;/g, '&'));

    return out.join('');
  }
  const hash = s => { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) >>> 0; return 'q' + h.toString(36); };

  /* ---------- 解析資料檔 ---------- */
  function parse(txt){
    const items = [], warn = [], meta = {}; let cur = null, field = null;
    const add = (c, f, s) => { if (f === 'm') c.m[c.m.length - 1] += '\n' + s; else c[f] += '\n' + s; };
    txt.replace(/^\uFEFF/, '').split(/\r?\n/).forEach((raw, n) => {
      const line = raw.replace(/\s+$/, ''), ln = n + 1;
      if (/^\s*#/.test(line)) return;
      if (/^\s*-{3,}\s*$/.test(line)){ field = null; return; }
      const m = line.match(KEY_RE);
      if (m){
        const k = KEYS[m[1].toUpperCase()], v = m[2].trim();
        if (META.includes(k)){ meta[k] = v; field = null; return; }
        if (k === 'q'){ cur = {q:v, m:[], a:'', d:'', l:[], c:'', cs:'', s:'', id:'', ln}; items.push(cur); field = 'q'; return; }
        if (!cur){ warn.push(`第 ${ln} 行：「${m[1]}」出現在第一個「Q:」之前，已略過。`); return; }
        if (k === 'm'){ cur.m.push(v); field = 'm'; }
        else if (k === 'l'){
          const p = v.split('|'), u = p[0].trim(), t = p.slice(1).join('|').trim();
          if (u) cur.l.push({u, t: t || u}); else warn.push(`第 ${ln} 行：連結缺少網址。`);
          field = null;
        }
        else if (k === 'c'){ const p = v.split('|'); cur.c = p[0].trim(); cur.cs = (p[1] || '').trim(); field = null; }
        else if (k === 's' || k === 'id'){ cur[k] = v; field = null; }
        else { cur[k] = v; field = k; }
        return;
      }
      if (!line.trim()){ if (cur && field) add(cur, field, ''); return; }
      if (!cur || !field){ warn.push(`第 ${ln} 行：不屬於任何欄位，已略過（是否漏了「D:」等標記？）`); return; }
      add(cur, field, line.replace(/^(\s*)\\/, '$1'));
    });
    const used = new Set();
    items.forEach(it => {
      ['q', 'a', 'd'].forEach(k => it[k] = it[k].replace(/^\s+|\s+$/g, ''));
      it.m = it.m.map(s => s.trim()).filter(Boolean);
      it.st = it.s ? STATUS[it.s.trim().toLowerCase()] || '' : '';
      if (!it.q) warn.push(`第 ${it.ln} 行：問題是空白的。`);
      if (!it.a) warn.push(`第 ${it.ln} 行「${it.q}」：缺少「A:」（簡答）。`);
      if (it.s && !it.st) warn.push(`第 ${it.ln} 行「${it.q}」：狀態「${it.s}」無法辨認。可用：已排除／已澄清／分析中／見其他專題（或 Ruled out / Clarified / Under analysis / See other section）。`);
      if (it.l.some(l => /^https?:\/\/\.\.\./.test(l.u))) warn.push(`第 ${it.ln} 行「${it.q}」：有連結仍是 https://... 佔位。`);
      if (!it.id) warn.push(`第 ${it.ln} 行「${it.q}」：沒有 ID:。中英對照及固定連結都需要 ID。`);
      let id = (it.id || '').replace(/[^\w-]/g, '') || hash(it.q);
      if (used.has(id)){ warn.push(`第 ${it.ln} 行：ID「${id}」重複，已自動改名。`); let k = 2; while (used.has(id + '-' + k)) k++; id += '-' + k; }
      used.add(id); it.id = id;
    });
    return {items, warn, meta};
  }

  /* ---------- 繪製 ---------- */
  const quote = s => L.qo + s + L.qc;
  function card(it){
    const st = it.st, x = st === 'done' || st === 'clar' ? ' x' : '';
    const myth = it.m.length ? `<div class="fq-m${x}"><b>${L.myth}</b>${it.m.length > 1
      ? '<ul>' + it.m.map(s => `<li>${quote(inl(s))}</li>`).join('') + '</ul>' : `<p>${quote(inl(it.m[0]))}</p>`}</div>` : '';
    const gate = it.m.length
      ? `<span>${L.gate}</span><button type="button" class="mc-btn" data-g="yes">${L.yes}</button><button type="button" class="mc-btn" data-g="no">${L.no}</button><button type="button" class="mc-btn" data-g="unsure">${L.unsure}</button>`
      : `<span>${L.think}</span><button type="button" class="mc-btn pri" data-g="">${L.show}</button>`;
    const links = it.l.map(l => { const e = /^https?:/i.test(l.u);
      return `<a href="${safeUrl(esc(l.u))}"${e ? ' target="_blank" rel="noopener"' : ''}>${inl(l.t)} ${e ? '↗' : '→'}</a>`; }).join('');
    return `<article class="fq-it" id="faq-${it.id}" data-id="${it.id}">
      <h3 class="fq-h"><button type="button" class="fq-q" aria-expanded="false" aria-controls="faq-${it.id}-b">
        <span class="fq-n">Q${it.n}</span><span class="fq-t">${inl(it.q)}</span>
        ${st ? `<span class="mc-tag ${st}">${L.st[st]}</span>` : ''}<span class="fq-chev" aria-hidden="true">▾</span></button></h3>
      <div class="fq-b" id="faq-${it.id}-b" hidden>
        ${myth}
        <div class="fq-gate">${gate}</div>
        <div class="fq-ans">
          <div class="fq-a"><b>${L.ans}</b>${block(it.a, true)}</div>
          <p class="fq-fb" hidden></p>
          ${it.d ? `<button type="button" class="fq-more" aria-expanded="false">${L.more}</button><div class="fq-d" hidden>${block(it.d)}</div>` : ''}
          ${links ? `<div class="fq-l">${links}</div>` : ''}
        </div>
        <div class="fq-tool"><span><button type="button" data-close>${L.close}</button><button type="button" data-next>${L.next}</button></span>
          <button type="button" data-copy="${it.id}">${L.copy}</button></div>
      </div></article>`;
  }

  /* 介面文字及語言按鈕 */
  function chrome(meta){
    const lc = lang === 'en' ? 'en' : 'zh-Hant-HK';
    ['#fq-hero', '#fq-main'].forEach(s => $(s).lang = lc);
    document.title = L.docTitle;
    $('#fq-eyebrow').textContent = L.eyebrow;
    $('#fq-home').textContent = L.home;
    $('#fq-here').textContent = L.here;
    $('#fq-title').textContent = meta.title || L.title;
    $('#fq-intro').textContent = meta.intro || L.intro;
    $('#fq-s').placeholder = L.search;
    $('#fq-s').setAttribute('aria-label', L.searchLabel);
    $('#fq-mode [data-mode="read"]').textContent = L.read;
    $('#fq-mode [data-mode="test"]').textContent = L.test;
    $('#fq-endbar').innerHTML = L.end;
    $$('#fq-lang button').forEach(b => { const on = b.dataset.lang === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  }

  /* mc.js 樞紐卡片 ↔ FAQ ID 檢查 */
  function hubCheck(warn){
    if (!window.MC || !Array.isArray(MC.myths)) return;
    MC.myths.forEach(m => {
      const main = m.href && m.href.startsWith('faq.html#faq-') ? m.href.slice(13) : '';
      [main, ...(m.faq || []).map(f => f[0])].filter(Boolean).forEach(id => {
        if (!BY[id]) warn.push(`mc.js「${m.t}」連到 FAQ ID「${id}」，但資料檔沒有這個 ID（是否改了名或刪除了？）。`);
      });
      if (main && BY[main] && (m.st === 'plan') !== (BY[main].st === 'plan'))
        warn.push(`狀態不一致：mc.js「${m.t}」是「${m.st}」，但 FAQ「${BY[main].q}」是「${BY[main].s || '（未設定）'}」。`);
    });
  }

  /* 中英兩個資料檔對照 */
  function crossCheck(mine){
    const other = lang === 'zh' ? 'en' : 'zh', box = $('#fq-check .fq-chk');
    getText(other).then(d => {
      const o = parse(d.t).items, oi = {}, mi = {}, w = [];
      o.forEach(i => oi[i.id] = i); mine.forEach(i => mi[i.id] = i);
      mine.forEach(i => { const j = oi[i.id];
        if (!j){ w.push(`ID「${i.id}」（${i.q}）：${d.f} 沒有這個 ID。`); return; }
        if (i.st !== j.st) w.push(`ID「${i.id}」：兩個語言的狀態不同（${i.s || '—'} ／ ${j.s || '—'}）。`);
        if (i.l.length !== j.l.length) w.push(`ID「${i.id}」：連結數目不同（${i.l.length} ／ ${j.l.length}）。`);
      });
      o.forEach(j => { if (!mi[j.id]) w.push(`ID「${j.id}」（${j.q}）：只在 ${d.f} 出現。`); });
      const a = mine.map(i => i.id).filter(id => oi[id]).join(), b = o.map(i => i.id).filter(id => mi[id]).join();
      if (a !== b) w.push('兩個語言檔的問題次序不同，切換語言時 Q 編號會不一致。');
      box.insertAdjacentHTML('beforeend', `<h4>🌐 中英對照檢查（對照 ${esc(d.f)}）</h4>`
        + (w.length ? `<ul>${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>✓ 兩個語言檔的 ID、狀態、連結數目及次序一致。</p>'));
    }).catch(e => box.insertAdjacentHTML('beforeend', `<p>⚠️ 未能載入另一語言檔作對照：${esc(e && e.message || e)}</p>`));
  }

  function go(d, snap){
    L = T[lang];
    const {items, warn, meta} = parse(d.t);
    items.forEach(it => {
      it.c = it.c || L.other;
      it.txt = [it.q, ...it.m, it.a, it.d, it.c].join(' ').toLowerCase();
      it.dtxt = it.d.toLowerCase();
    });
    $('#fq-err').hidden = true;
    chrome(meta);

    const cats = [...new Set(items.map(i => i.c))];
    const order = cats.flatMap(c => items.filter(i => i.c === c));
    order.forEach((it, i) => it.n = i + 1);
    ITEMS = order; BY = {}; order.forEach(i => BY[i.id] = i);
    hubCheck(warn);
    if (warn.length) console.warn(`[FAQ] ${d.f}:\n` + warn.join('\n'));

    if (CHECK){
      const c = $('#fq-check'); c.hidden = false;
      c.innerHTML = `<div class="fq-chk"><h3>🛠️ 檢查模式 Check mode · ${esc(d.f)}</h3><p>讀到 <b>${items.length}</b> 條問題、<b>${cats.length}</b> 個分類。</p>
        ${warn.length ? `<p>發現 ${warn.length} 個需要注意的地方：</p><ul>${warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : '<p>✓ 沒有發現格式問題。</p>'}</div>`;
      crossCheck(items);
    }
    $('#fq-upd').textContent = (meta.u ? L.upd(meta.u) : '') + L.gen(d.f);

    if (!items.length){ $('#fq-list').innerHTML = `<p class="fq-empty">${L.none}</p>`; return; }
    const cnt = k => items.filter(i => i.st === k).length;
    $('#fq-stats').innerHTML = [[items.length, L.nQ], [cats.length, L.nC], [cnt('done'), L.done], [cnt('clar'), L.clar], [cnt('plan'), L.plan]]
      .filter((x, i) => i < 2 || x[0]).map(([n, t]) => `<div><b>${n}</b><span>${t}</span></div>`).join('');
    const short = {}; items.forEach(i => { if (i.cs && !short[i.c]) short[i.c] = i.cs; });
    $('#fq-chips').innerHTML = [['', L.all, items.length], ...cats.map(c => [c, short[c] || c, items.filter(i => i.c === c).length])]
      .map(([c, t, n]) => `<button type="button" data-c="${esc(c)}"${c ? ` title="${esc(c)}"` : ''}>${esc(t)}<small>${n}</small></button>`).join('');
    $('#fq-list').innerHTML = cats.map(c => `<section class="fq-g" data-c="${esc(c)}"><h2>${esc(c)}<small>${items.filter(i => i.c === c).length}</small></h2>
      ${order.filter(i => i.c === c).map(card).join('')}</section>`).join('')
      + `<p class="fq-empty" id="fq-none" hidden>${L.none}</p>`;
    $('#fq-list').classList.toggle('test', mode === 'test');

    if (snap){ cat = snap.catId && BY[snap.catId] ? BY[snap.catId].c : ''; query = ''; $('#fq-s').value = ''; }
    else if (cat && !cats.includes(cat)) cat = '';
    syncChips(); apply();
    if (snap) restore(snap); else fromHash();
  }

  /* ---------- 切換語言 ---------- */
  function getText(lg){
    if (CACHE[lg]) return Promise.resolve(CACHE[lg]);
    const list = SRC[lg];
    const tryAt = i => fetch(list[i] + '?v=' + Date.now(), {cache: 'no-store'})
      .then(r => { if (!r.ok) throw new Error(list[i] + ' · HTTP ' + r.status); return r.text(); })
      .then(t => ({t, f: list[i]}))
      .catch(e => i + 1 < list.length ? tryAt(i + 1) : Promise.reject(e));
    return tryAt(0).then(d => (CACHE[lg] = d));
  }
  function snapshot(){
    const ofIt = sel => $$(sel).map(e => e.closest('.fq-it').dataset.id);
    const an = $$('.fq-it:not([hidden])').find(a => a.getBoundingClientRect().bottom > 90);
    return {open: ofIt('.fq-it.open'), more: ofIt('.fq-more[aria-expanded="true"]'), rev: ofIt('.fq-it.rev'),
      catId: cat ? ((ITEMS.find(i => i.c === cat) || {}).id || '') : '',
      anchor: an ? an.dataset.id : '', off: an ? an.getBoundingClientRect().top : 0};
  }
  function restore(s){
    const el = id => document.getElementById('faq-' + id);
    s.open.forEach(id => { const a = el(id); if (a && !a.hidden) setOpen(a, true); });
    s.more.forEach(id => { const a = el(id); if (a) setMore(a, true); });
    s.rev.forEach(id => { const a = el(id); if (a) a.classList.add('rev'); });
    allLabel();
    const a = s.anchor && el(s.anchor);
    if (a && !a.hidden) window.scrollBy(0, a.getBoundingClientRect().top - s.off);
  }
  function remember(lg){
    try { localStorage.setItem(STORE, lg); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set('lang', lg); history.replaceState(null, '', u.href);
  }
  function setLang(lg){
    if (lg === lang || busy) return;
    busy = true;
    const snap = ITEMS.length ? snapshot() : null, prev = lang;
    $('#fq-lang').setAttribute('aria-busy', 'true');
    getText(lg)
      .then(d => { lang = lg; remember(lg); go(d, snap); })
      .catch(e => { lang = prev; L = T[prev]; $('#fq-count').textContent = `${L.switchFail}（${e && e.message || e}）`; })
      .finally(() => { busy = false; $('#fq-lang').removeAttribute('aria-busy'); });
  }

  /* ---------- 搜尋標示 ---------- */
  function unmark(root){
    root.querySelectorAll('mark.fq-hl').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    root.normalize();
  }
  function mark(root, terms){
    const re = new RegExp(terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
      n.parentNode.closest('.fq-tool, .fq-gate, .fq-n, .mc-tag') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n => {
      const s = n.nodeValue; re.lastIndex = 0; if (!re.test(s)) return;
      const f = document.createDocumentFragment(); let i = 0; re.lastIndex = 0;
      s.replace(re, (m, off) => { f.append(s.slice(i, off)); const mk = document.createElement('mark');
        mk.className = 'fq-hl'; mk.textContent = m; f.append(mk); i = off + m.length; return m; });
      f.append(s.slice(i)); n.replaceWith(f);
    });
  }

  /* ---------- 互動 ---------- */
  function setOpen(a, on){
    a.classList.toggle('open', on);
    a.querySelector('.fq-q').setAttribute('aria-expanded', on);
    a.querySelector('.fq-b').hidden = !on;
  }
  function setMore(a, on){
    const mo = a.querySelector('.fq-more'); if (!mo) return;
    mo.setAttribute('aria-expanded', on); mo.nextElementSibling.hidden = !on;
  }
  function allLabel(){
    const vis = $$('.fq-it:not([hidden])');
    $('#fq-all').textContent = vis.length && vis.every(a => a.classList.contains('open')) ? L.collapse : L.expand;
  }
  function syncChips(){
    $$('#fq-chips button').forEach(b => { const on = b.dataset.c === cat; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  }
  function apply(){
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean), hits = [];
    $$('.fq-it').forEach(a => {
      const it = BY[a.dataset.id], ok = (!cat || it.c === cat) && terms.every(t => it.txt.includes(t));
      a.hidden = !ok; if (ok) hits.push(a);
    });
    $$('.fq-g').forEach(g => g.hidden = !g.querySelector('.fq-it:not([hidden])'));
    const none = $('#fq-none'); if (none) none.hidden = hits.length > 0;
    unmark($('#fq-list'));
    if (terms.length){
      hits.forEach(a => mark(a, terms));
      if (hits.length <= 3) hits.forEach(a => {
        setOpen(a, true);
        if (terms.some(t => BY[a.dataset.id].dtxt.includes(t))) setMore(a, true);
      });
    }
    $$('[data-next]').forEach(b => b.hidden = false);
    if (hits.length){ const lb = hits[hits.length - 1].querySelector('[data-next]'); if (lb) lb.hidden = true; }
    $('#fq-count').textContent = terms.length || cat ? L.shown(hits.length, ITEMS.length) : L.total(ITEMS.length);
    allLabel();
  }
  function reveal(btn){
    const a = btn.closest('.fq-it'), it = BY[a.dataset.id], v = btn.dataset.g, fb = a.querySelector('.fq-fb');
    a.classList.add('rev');
    const t = it.st === 'plan' ? L.fbPlan : v === 'yes' ? L.fbYes : v === 'no' ? L.fbNo : v === 'unsure' ? L.fbUn : '';
    fb.textContent = t; fb.hidden = !t;
  }
  function copy(b){
    const id = b.dataset.copy, u = new URL(location.href);
    u.searchParams.delete('check'); u.searchParams.set('lang', lang); u.hash = 'faq-' + id;
    const url = u.href;
    history.replaceState(null, '', '#faq-' + id);
    const done = () => { b.textContent = L.copied; setTimeout(() => b.textContent = L.copy, 1800); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => prompt(L.prompt, url));
    else prompt(L.prompt, url);
  }
  function fromHash(){
    const h = decodeURIComponent(location.hash.slice(1)); if (!h.startsWith('faq-')) return;
    const a = document.getElementById(h); if (!a) return;
    if (a.hidden){ cat = ''; query = ''; $('#fq-s').value = ''; syncChips(); apply(); }
    setOpen(a, true); allLabel();
    a.classList.add('flash'); setTimeout(() => a.classList.remove('flash'), 1600);
    requestAnimationFrame(() => a.scrollIntoView({behavior: SCROLL, block: 'start'}));
  }

  $('#fq-list').addEventListener('click', e => {
    const q = e.target.closest('.fq-q');
    if (q){ const a = q.closest('.fq-it'); setOpen(a, !a.classList.contains('open')); allLabel(); return; }
    const mo = e.target.closest('.fq-more');
    if (mo){ setMore(mo.closest('.fq-it'), mo.getAttribute('aria-expanded') !== 'true'); return; }
    const g = e.target.closest('[data-g]'); if (g){ reveal(g); return; }
    const cl = e.target.closest('[data-close]');
    if (cl){
      const a = cl.closest('.fq-it'); setOpen(a, false); allLabel();
      if (a.getBoundingClientRect().top < 0) a.scrollIntoView({behavior: SCROLL, block: 'start'});
      return;
    }
    const nx = e.target.closest('[data-next]');
    if (nx){
      const a = nx.closest('.fq-it'), vis = $$('.fq-it:not([hidden])'), n = vis[vis.indexOf(a) + 1];
      setOpen(a, false);
      if (n){ setOpen(n, true); requestAnimationFrame(() => n.scrollIntoView({behavior: SCROLL, block: 'start'})); }
      allLabel(); return;
    }
    const cp = e.target.closest('[data-copy]'); if (cp) copy(cp);
  });
  $('#fq-lang').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); });
  $('#fq-chips').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; syncChips(); apply(); });
  let tm; $('#fq-s').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { query = e.target.value.trim(); apply(); }, 150); });
  $('#fq-mode').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    mode = b.dataset.mode;
    $$('#fq-mode button').forEach(x => x.classList.toggle('on', x === b));
    $('#fq-list').classList.toggle('test', mode === 'test');
    $$('.fq-it').forEach(a => { a.classList.remove('rev'); const f = a.querySelector('.fq-fb'); if (f) f.hidden = true; });
  });
  $('#fq-all').addEventListener('click', () => {
    const vis = $$('.fq-it:not([hidden])'), on = !vis.every(a => a.classList.contains('open'));
    vis.forEach(a => setOpen(a, on)); allLabel();
  });
  addEventListener('hashchange', fromHash);

  /* ---------- 載入 ---------- */
  function fail(err){
    $('#fq-list').innerHTML = '';
    const el = $('#fq-err'); el.hidden = false;
    const local = location.protocol === 'file:';
    el.innerHTML = `<div class="fq-errb"><h3>${L.errTitle}</h3><p>${local ? L.errLocal : L.errServer(SRC[lang][0])}</p>
      <p class="mc-note">${L.errTech}${esc(err && err.message || err)}</p>
      <label class="mc-btn pri" style="display:inline-block">${L.errPick}<input type="file" id="fq-file" accept=".txt,text/plain" hidden></label></div>`;
    $('#fq-file').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      lang = /-en\b|_en\b/i.test(file.name) ? 'en' : /-zh\b|_zh\b/i.test(file.name) ? 'zh' : lang;
      const r = new FileReader(); r.onload = () => go({t: r.result, f: file.name}); r.readAsText(file, 'utf-8');
    });
  }
  chrome({});
  $('#fq-list').innerHTML = `<p class="fq-empty">${L.loading}</p>`;
  getText(lang).then(d => go(d)).catch(fail);
})();
</script>
</body>
</html>
